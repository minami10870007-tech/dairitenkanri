# Netlify 設定。ビルド不要の静的サイトなので publish するフォルダを指すだけ。
[build]
  publish = "netlify"

# すべてのページに付けるヘッダー
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    # 外部スクリプトも外部 CSS も読み込まない。通信先は Apps Script だけに限定する
    Content-Security-Policy = "default-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'; img-src 'self' data:; style-src 'unsafe-inline'; script-src 'unsafe-inline'; connect-src https://script.google.com https://script.googleusercontent.com; manifest-src 'self'"

# HTML は常に最新を取りに行かせる（更新がすぐ反映されるように）
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
